# Unilux's default recipe. Copy it to make your own: `unilux recipe export
# recommended > mine.toml`, edit, then `unilux recipe import mine.toml`.
format = 1
id = "recommended"
title = "Recommended"
description = "Built for the latest GE-Proton: sign-in fix, yt-dlp fix, launcher stability in VR. Video decoding, streams and the exit crash are handled by GE-Proton itself."
# GE-Proton11-12 carries the video work this recipe used to patch in:
# http(s)/RTSP/HLS by URL without blocking (ge-video-rework 0078, 0083,
# 0084, 0087, 0104), googlevideo progressive streams (0028), AV1 through
# dav1d, and UiaDisconnectAllProviders (somnilux#29). Only the schannel
# client-certificate fix is still missing upstream of GE, so the build
# is the small upstream-Wine one and GE's own winedmo/ffmpeg ship as is.
# yt-dlp runs with its defaults (somnilux#32).
# GE-Proton11-14 adds more of it (looped Unity video under DXVK, winedmo
# system-memory fallback, ge-video-rework 0110-0134) and stops wineopenxr
# from starting SteamVR on background OpenXR probes (GE #942). Its Wine
# still lacks the schannel fix, so the ingredients are unchanged.
# Somnium 3.2.0 pins a yt-dlp.exe built with PyInstaller 6.22.3, which
# Wine's _wtempnam() breaks; pyinstaller-tempnam ships msvcrt
# rebuilt from the Proton's own tree with that one fix.
ingredients = ["tls-client-certs", "pyinstaller-tempnam", "no-wintab"]
