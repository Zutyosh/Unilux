name: Community index

# community/index.json is generated: rebuilt here whenever a recipe or a
# report lands on main, so submissions never conflict on it.
on:
  push:
    branches: [main]
    paths: ["community/recipes/**", "patches/**", "crates/unilux-patches/**"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  index:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build unilux
        run: cargo build --release -p unilux-cli
      - name: Rebuild the index
        env:
          UNILUX_PATCHES_DIR: ${{ github.workspace }}/patches
        run: ./target/release/unilux community index community --write
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet community/index.json && exit 0
          branch="community/index"
          git config user.name "unilux-bot"
          git config user.email "unilux-bot@users.noreply.github.com"
          git checkout -B "$branch"
          git add community/index.json
          git commit -m "community: rebuild the index"
          git push -f origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --base main --state open --json number -q '.[].number')" ]; then
            gh pr create --base main --head "$branch" \
              --title "community: rebuild the index" \
              --body "Generated index, rebuilt from the recipes and reports on main."
          fi
